name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke policy simulation CLI
        run: |
          python -m open_ep_framework.cli --mode policy-simulation --example examples/policy_simulation_profile.json --audit policy_simulation_audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('policy_simulation_audit.json').read_text())
          assert audit['run_id'] == 'policy-sim-source-intake-run-001'
          assert audit['scenario'] == 'redistribution-transfer-release-synthetic'
          assert audit['outputs']['summary']['runtime_dependency'] is False
          assert audit['outputs']['summary']['release_ratio'] == 0.6
          PY
      - name: Upload policy simulation audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: policy-simulation-audit
          path: policy_simulation_audit.json
          if-no-files-found: error
