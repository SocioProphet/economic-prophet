name: value-relativity

on:
  pull_request:
    paths:
      - "src/open_ep_framework/benchmarking/**"
      - "src/open_ep_framework/value_ordering/**"
      - "schemas/index_relative_cohort.schema.json"
      - "schemas/value_frame_observation.schema.json"
      - "examples/benchmarking/**"
      - "examples/value_ordering/**"
      - "scripts/validate_benchmarking.py"
      - "scripts/validate_value_ordering.py"
      - "tests/test_index_relative.py"
      - "tests/test_value_ordering.py"
      - ".github/workflows/value-relativity.yml"
  push:
    branches:
      - main
    paths:
      - "src/open_ep_framework/benchmarking/**"
      - "src/open_ep_framework/value_ordering/**"
      - "schemas/index_relative_cohort.schema.json"
      - "schemas/value_frame_observation.schema.json"
      - "examples/benchmarking/**"
      - "examples/value_ordering/**"
      - "scripts/validate_benchmarking.py"
      - "scripts/validate_value_ordering.py"
      - "tests/test_index_relative.py"
      - "tests/test_value_ordering.py"
      - ".github/workflows/value-relativity.yml"
  workflow_dispatch:

jobs:
  value-relativity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + validation deps
        run: python -m pip install -e . pytest jsonschema
      - name: Byte-compile the deterministic, stdlib-only modules
        run: python -m py_compile
          src/open_ep_framework/benchmarking/index_relative.py
          src/open_ep_framework/value_ordering/relativity.py
          scripts/validate_benchmarking.py
          scripts/validate_value_ordering.py
      - name: IRB-1 + RVO-1 per-tooth mutation tests
        run: python -m pytest -q tests/test_index_relative.py tests/test_value_ordering.py
      - name: IRB-1 contract teeth (VERIFIES + REJECTS + COHERENCE over fixtures)
        run: python scripts/validate_benchmarking.py
      - name: RVO-1 contract teeth (VERIFIES + REJECTS + COHERENCE over fixtures)
        run: python scripts/validate_value_ordering.py
      - name: Emit deterministic receipts
        run: |
          mkdir -p build
          python -m open_ep_framework.benchmarking \
            --book examples/benchmarking/index_relative_book.valid.json \
            --receipt build/index_relative_receipt.json
          python -m open_ep_framework.value_ordering \
            --record examples/value_ordering/eventual_consistency.valid.json \
            --receipt build/value_ordering_receipt.json
      - name: Upload IRB-1 / RVO-1 receipts
        uses: actions/upload-artifact@v4
        with:
          name: value-relativity-receipts
          path: |
            build/index_relative_receipt.json
            build/value_ordering_receipt.json
          if-no-files-found: error
